name: Guidini
description: A Mobile App for Connecting Travelers with Local Guides
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  google_fonts: ^6.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.9  # Use the latest version

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: lib/assets/fonts/InstrumentSans-Regular.ttf
        - asset: lib/assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
  assets:
    - assets/icons/chat_bubble.svg
