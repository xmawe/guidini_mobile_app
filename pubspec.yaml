name: Guidini
description: A Mobile App for Connecting Travelers with Local Guides
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  google_fonts: ^4.0.3
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700

  assets:
    - assets/icons/search_icon.png
    - assets/icons/star_filled.png
    - assets/icons/checkmark_icon.png
    - assets/icons/clock_small_icon.png
    - assets/icons/eye_icon.png
    - assets/icons/chat_icon.png
    - assets/icons/home_nav_icon.png
    - assets/icons/search_nav_icon.png
    - assets/icons/bookings_nav_icon.png
    - assets/icons/conversations_nav_icon.png
    - assets/icons/verified_icon.png
    - assets/icons/workshop_icon.png
    - assets/icons/transport_icon.png
    - assets/icons/tea_icon.png
    - assets/icons/group_icon.png
    - assets/icons/explore_icon.png
    - assets/icons/clock_small_icon.png
    - assets/icons/clock_icon.png
    - assets/icons/activity_icon.png
    - assets/icons/export_icon.png
    - assets/images/marrakech_tour.jpg
    

