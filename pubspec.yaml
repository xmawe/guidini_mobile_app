name: Guidini
description: A Mobile App for Connecting Travelers with Local Guides
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  google_fonts: ^4.0.3
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: lib/assets/fonts/InstrumentSans-Regular.ttf
        - asset: lib/assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
  assets:
    - lib/assets/images/nav_icons/
