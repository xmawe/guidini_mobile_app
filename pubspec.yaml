name: guidini
description: A Mobile App for Connecting Travelers with Local Guides
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.1.0
  google_fonts: ^4.0.3
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.7
  provider: ^6.1.1
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: lib/assets/fonts/InstrumentSans-Regular.ttf
        - asset: lib/assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
  assets:
    - lib/assets/images/
    - lib/assets/icons/
